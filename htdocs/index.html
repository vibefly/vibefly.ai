<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vibefly.ai</title>
    <meta name="description" content="">
    <link rel="stylesheet" href="styles.css">
    <script>window.__CONTENT = fetch('content.json').then(function(r) { return r.ok ? r.json() : Promise.reject(); });</script>
    <style>body{opacity:0}body.content-loaded{opacity:1;transition:opacity .15s}</style>
    <noscript><style>body{opacity:1}</style></noscript>
</head>
<body>

    <!-- Header -->
    <header class="site-header" role="banner">
        <div class="header-inner">
            <a href="#hero" class="logo">
                <span data-content="logo.name">vibefly</span><span class="logo-dot" data-content="logo.tld">.ai</span>
            </a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
            </button>
            <nav class="main-nav" id="main-nav" role="navigation">
                <ul class="nav-list" data-content-nav></ul>
            </nav>
        </div>
    </header>

    <!-- Hero -->
    <section id="hero" class="hero" data-section="hero">
        <div class="hero-bg">
            <div class="hero-orb hero-orb--1"></div>
            <div class="hero-orb hero-orb--2"></div>
            <div class="hero-orb hero-orb--3"></div>
            <div class="hero-grid"></div>
        </div>
        <div class="hero-content">
            <p class="hero-tagline" data-content="hero.tagline">AI-Powered Web Design</p>
            <h1 class="hero-title">
                <span data-content="hero.titleLine1">Websites that</span><br>
                <span data-content="hero.titleLine2">accelerate growth</span>
            </h1>
            <p class="hero-subtext" data-content="hero.subtext">Intelligent agents design, build, and refine your website.</p>
            <a href="#contact" class="primary-shiny-btn cta-button--wide" data-content="hero.ctaText" data-content-attr-href="hero.ctaHref">Get Started</a>
        </div>
    </section>

    <!-- How It Works -->
    <section id="how-it-works" class="section" data-section="steps">
        <h2 class="section-heading" data-content="steps.heading">How It Works</h2>
        <div class="steps-grid" data-steps-grid></div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section section--contact" data-section="contact">
        <h2 class="section-heading" data-content="contact.heading">Get in Touch</h2>
        <p class="contact-subtext" data-content="contact.subtext">Tell us about your project.</p>
        <form id="contact-form" class="contact-form" action="/api/submit" method="POST">
            <div class="form-row">
                <label for="contact-first-name">First Name</label>
                <input type="text" id="contact-first-name" name="first_name" placeholder="First name" required pattern="^[A-Za-z][A-Za-z\s'-]{1,}$" title="Enter a valid first name.">
            </div>
            <div class="form-row">
                <label for="contact-last-name">Last Name</label>
                <input type="text" id="contact-last-name" name="last_name" placeholder="Last name" required pattern="^[A-Za-z][A-Za-z\s'-]{1,}$" title="Enter a valid last name.">
            </div>
            <div class="form-row">
                <label for="contact-company">Company</label>
                <input type="text" id="contact-company" name="company" placeholder="Your organization">
            </div>
            <div class="form-row">
                <label for="contact-phone">Phone</label>
                <input type="tel" id="contact-phone" name="phone" placeholder="(555) 123-4567" pattern="^\+?[0-9\s().-]{7,}$" title="Enter a valid phone number.">
            </div>
            <div class="form-row">
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-row">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="5" placeholder="What can we do for you?" required></textarea>
            </div>
            <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot">
            <button type="submit" class="primary-shiny-btn cta-button--wide">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <p>
            <span data-content="footer.creditText">Built by</span>
            <a data-content-footer-credit href="https://motivefx.com" target="_blank" rel="noopener">motiveFx</a>
        </p>
    </footer>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
