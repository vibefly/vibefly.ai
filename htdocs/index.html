<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vibefly.ai</title>
    <meta name="description" content="">
    <link rel="stylesheet" href="styles.css">
    <script id="content-fetch">window.__CONTENT = fetch('content.json').then(function(r) { return r.ok ? r.json() : Promise.reject(); });</script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
    <style>body{opacity:0}body.content-loaded{opacity:1;transition:opacity .15s}</style>
    <noscript><style>body{opacity:1}</style></noscript>
</head>
<body>

    <!-- Header -->
    <header class="site-header" role="banner">
        <div class="header-inner">
            <a href="#hero" class="logo">
                <span data-content="logo.name">vibefly</span><span class="logo-dot" data-content="logo.tld">.ai</span>
            </a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
            </button>
            <nav class="main-nav" id="main-nav" role="navigation">
                <ul class="nav-list" data-content-nav></ul>
            </nav>
        </div>
    </header>

    <!-- Hero -->
    <section id="hero" class="hero" data-section="hero">
        <div class="hero-bg">
            <div class="hero-orb hero-orb--1"></div>
            <div class="hero-orb hero-orb--2"></div>
            <div class="hero-orb hero-orb--3"></div>
            <div class="hero-grid"></div>
        </div>
        <div class="hero-content">
            <p class="hero-tagline" data-content="hero.label">AI-Powered Web Design</p>
            <h1 class="hero-title" data-content="hero.title">Websites that accelerate growth</h1>
            <p class="hero-subtext" data-content="hero.subtext">Intelligent agents design, build, and refine your website.</p>
            <a href="#contact" class="primary-shiny-btn cta-button--wide" data-content="hero.ctaText" data-content-attr-href="hero.ctaHref">Get Started</a>
        </div>
    </section>

    <!-- Dynamic sections (how-it-works, etc.) -->
    <div id="sections-container"></div>

    <!-- Contact -->
    <section id="contact" class="section section--contact" data-section="contact">
        <h2 class="section-heading" data-content="contact.heading">Get in Touch</h2>
        <p class="contact-subtext" data-content="contact.subheading">Tell us about your project.</p>
        <form id="contact-form" class="contact-form" action="/api/submit" method="POST">
            <input type="text" name="_hp" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot">
            <div id="form-fields-placeholder"></div>
            <button type="submit" class="primary-shiny-btn cta-button--wide">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <p>
            <span data-content="footer.creditText">Built by</span>
            <a data-content-footer-credit href="https://motivefx.com" target="_blank" rel="noopener">motiveFx</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.576.0/dist/umd/lucide.min.js" defer></script>
    <script src="js/content-loader.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
